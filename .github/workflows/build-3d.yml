name: build-3d

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id (16-32 lowercase hex chars)"
        required: true
        type: string
      odm_options:
        description: "ODM options (empty = chosen automatically from the job settings)"
        required: false
        default: ""
        type: string
      contour_interval:
        description: "Contour interval in meters for the DXF export (survey mode only)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: build-3d-${{ inputs.job_id }}
  cancel-in-progress: false

env:
  JOB_ID: ${{ inputs.job_id }}
  IN_TAG: in-${{ inputs.job_id }}
  OUT_TAG: model-${{ inputs.job_id }}
  GH_TOKEN: ${{ github.token }}
  ODM_IMAGE: opendronemap/odm:3.5.6

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Validate job id
        run: |
          [[ "$JOB_ID" =~ ^[a-f0-9]{16,32}$ ]] || { echo "invalid job id"; exit 1; }

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /
          # swap is optional: if it fails, continue
          (sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile) || echo "swap setup skipped"
          free -h

      - name: Install Python dependencies
        run: |
          python3 -m pip install --quiet -r scripts/requirements.txt \
            || python3 -m pip install --quiet --break-system-packages -r scripts/requirements.txt

      - name: Fetch encryption key
        env:
          KEY_URL: ${{ secrets.KEY_URL }}
          KEY_TOKEN: ${{ secrets.KEY_TOKEN }}
          TEST_KEY_B64: ${{ secrets.TEST_KEY_B64 }}
        run: |
          if [ -n "$KEY_URL" ]; then
            resp=$(curl -fsS -X POST "$KEY_URL" \
              -H "Authorization: Bearer $KEY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"job_id\":\"$JOB_ID\"}")
            key=$(printf '%s' "$resp" | jq -r '.key_b64 // empty')
          else
            key="$TEST_KEY_B64"
          fi
          [ -n "$key" ] || { echo "no key available (set KEY_URL/KEY_TOKEN or TEST_KEY_B64)"; exit 1; }
          echo "::add-mask::$key"
          echo "S3D_KEY_B64=$key" >> "$GITHUB_ENV"

      - name: Download encrypted photos
        run: |
          mkdir -p work/enc
          gh release download "$IN_TAG" --repo "$GITHUB_REPOSITORY" --dir work/enc --pattern '*.enc'
          echo "downloaded $(ls work/enc | wc -l) files"

      - name: Decrypt photos
        run: |
          mkdir -p work/project/images
          python3 scripts/s3d.py decrypt-dir work/enc work/project/images --ext .jpg --meta-out work/job.json
          echo "IMAGES=$(find work/project/images -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) | wc -l)" >> "$GITHUB_ENV"
          rm -rf work/enc

      - name: Prepare ODM options
        env:
          ODM_OPTIONS: ${{ inputs.odm_options }}
        run: |
          python3 scripts/odm_options.py --job work/job.json --images work/project/images --override "$ODM_OPTIONS" > work/odm_options.txt
          echo "ODM options: $(cat work/odm_options.txt)"

      - name: Run OpenDroneMap
        run: |
          docker run --rm -v "$PWD/work:/datasets" "$ODM_IMAGE" --project-path /datasets project $(cat work/odm_options.txt) \
            2>&1 | tee work/odm_run.log

      - name: Run engineering analysis (survey mode only)
        continue-on-error: true
        run: |
          mkdir -p work/project/analysis
          MODE=$(python3 -c "import json; print(json.load(open('work/job.json')).get('mode','preview'))" 2>/dev/null || echo preview)
          if [ "$MODE" != "survey" ]; then
            echo "preview mode: skipping volume/report/contours"
            exit 0
          fi
          DSM=work/project/odm_dem/dsm.tif
          if [ ! -f "$DSM" ]; then
            echo "no dsm.tif produced, skipping analysis"
            exit 0
          fi

          REF_ELEV=$(python3 -c "import json; print(json.load(open('work/job.json')).get('referenceElevation',''))" 2>/dev/null)
          if [ -n "$REF_ELEV" ]; then
            python3 scripts/volume.py --dsm "$DSM" --reference-elevation "$REF_ELEV" \
              --out work/project/analysis/volume.json \
              || echo "warning: volume calculation failed, continuing without it"
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin
          python3 scripts/export_engineering.py --dsm "$DSM" --out-dir work/project/analysis \
            --interval "${{ inputs.contour_interval }}" \
            || echo "warning: contour export failed, continuing without it"

          VOL_ARG=""
          [ -f work/project/analysis/volume.json ] && VOL_ARG="--volume work/project/analysis/volume.json"
          python3 scripts/accuracy_report.py --dsm "$DSM" \
            --stats work/project/odm_report/stats.json --job work/job.json \
            $VOL_ARG --out work/project/analysis/report.pdf \
            || echo "warning: report generation failed, continuing without it"

      - name: Encrypt outputs and publish
        run: |
          python3 scripts/publish.py --project work/project --out work/out --job work/job.json
          gh release create "$OUT_TAG" work/out/*.enc \
            --repo "$GITHUB_REPOSITORY" --title "$OUT_TAG" --notes "encrypted outputs"

      - name: Delete raw photos
        run: |
          gh release delete "$IN_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

      - name: Notify app
        if: always()
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -n "$CALLBACK_URL" ] || { echo "no callback configured"; exit 0; }
          status=$([ "$JOB_STATUS" = success ] && echo done || echo failed)
          assets=$(cat work/out/assets.json 2>/dev/null || echo '[]')
          summary=$(cat work/out/summary.json 2>/dev/null || echo '{}')
          if [ "$status" = "failed" ]; then
            error_tail=$(tail -c 4000 work/odm_run.log 2>/dev/null | jq -Rs . || echo 'null')
          else
            error_tail='null'
          fi
          body=$(jq -n --arg id "$JOB_ID" --arg st "$status" --arg tag "$OUT_TAG" \
            --arg run "$GITHUB_RUN_ID" --argjson n "${IMAGES:-0}" \
            --argjson assets "$assets" --argjson summary "$summary" --argjson error_tail "$error_tail" \
            '{job_id:$id,status:$st,model_tag:$tag,images:$n,run_id:$run,assets:$assets,summary:$summary,error_tail:$error_tail}')
          curl -fsS -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" -d "$body" || true
