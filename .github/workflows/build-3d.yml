name: build-3d

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id (16-32 lowercase hex chars)"
        required: true
        type: string
      odm_options:
        description: "ODM options (empty = low-resource defaults)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: build-3d-${{ inputs.job_id }}
  cancel-in-progress: false

env:
  JOB_ID: ${{ inputs.job_id }}
  IN_TAG: in-${{ inputs.job_id }}
  OUT_TAG: model-${{ inputs.job_id }}
  GH_TOKEN: ${{ github.token }}
  ODM_IMAGE: opendronemap/odm:latest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: Validate job id
        run: |
          [[ "$JOB_ID" =~ ^[a-f0-9]{16,32}$ ]] || { echo "invalid job id"; exit 1; }

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /
          # swap is optional: if it fails, continue
          (sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile) || echo "swap setup skipped"
          free -h

      - name: Fetch encryption key
        env:
          KEY_URL: ${{ secrets.KEY_URL }}
          KEY_TOKEN: ${{ secrets.KEY_TOKEN }}
          TEST_KEY_B64: ${{ secrets.TEST_KEY_B64 }}
        run: |
          if [ -n "$KEY_URL" ]; then
            resp=$(curl -fsS -X POST "$KEY_URL" \
              -H "Authorization: Bearer $KEY_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"job_id\":\"$JOB_ID\"}")
            key=$(printf '%s' "$resp" | jq -r '.key_b64 // empty')
          else
            key="$TEST_KEY_B64"
          fi
          [ -n "$key" ] || { echo "no key available (set KEY_URL/KEY_TOKEN or TEST_KEY_B64)"; exit 1; }
          echo "::add-mask::$key"
          echo "S3D_KEY_B64=$key" >> "$GITHUB_ENV"

      - name: Download encrypted photos
        run: |
          mkdir -p work/enc
          gh release download "$IN_TAG" --repo "$GITHUB_REPOSITORY" --dir work/enc --pattern '*.enc'
          echo "downloaded $(ls work/enc | wc -l) files"

      - name: Decrypt photos
        run: |
          pip install --quiet cryptography
          mkdir -p work/project/images
          python scripts/s3d.py decrypt-dir work/enc work/project/images --ext .jpg
          echo "IMAGES=$(ls work/project/images | wc -l)" >> "$GITHUB_ENV"
          rm -rf work/enc

      - name: Run OpenDroneMap
        env:
          ODM_OPTIONS: ${{ inputs.odm_options }}
        run: |
          DEFAULTS="--pc-quality low --feature-quality low --mesh-size 100000 --mesh-octree-depth 10 --skip-orthophoto --skip-report --gltf --max-concurrency 4"
          OPTS="${ODM_OPTIONS:-$DEFAULTS}"
          docker run --rm -v "$PWD/work:/datasets" "$ODM_IMAGE" --project-path /datasets project $OPTS

      - name: Encrypt model and publish
        run: |
          glb=$(find work/project -name '*_geo.glb' | head -n1)
          [ -n "$glb" ] || glb=$(find work/project -name '*.glb' | head -n1)
          [ -n "$glb" ] || { echo "ODM produced no .glb"; exit 1; }
          python scripts/s3d.py encrypt "$glb" work/model.glb.enc
          gh release create "$OUT_TAG" work/model.glb.enc \
            --repo "$GITHUB_REPOSITORY" --title "$OUT_TAG" --notes "encrypted model"

      - name: Delete raw photos
        run: |
          gh release delete "$IN_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

      - name: Notify app
        if: always()
        env:
          CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -n "$CALLBACK_URL" ] || { echo "no callback configured"; exit 0; }
          status=$([ "$JOB_STATUS" = success ] && echo done || echo failed)
          body=$(jq -n --arg id "$JOB_ID" --arg st "$status" --arg tag "$OUT_TAG" \
            --arg run "$GITHUB_RUN_ID" --argjson n "${IMAGES:-0}" \
            '{job_id:$id,status:$st,model_tag:$tag,model_asset:"model.glb.enc",images:$n,run_id:$run}')
          curl -fsS -X POST "$CALLBACK_URL" \
            -H "Authorization: Bearer $CALLBACK_TOKEN" \
            -H "Content-Type: application/json" -d "$body" || true
